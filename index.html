<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>AethoFlix</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0b0b10; --surface:#17171f; --surface-2:#23232d; --text:#f7f7f9;
      --muted:#b7b7c0; --line:rgba(255,255,255,.14); --accent:#e50914; --accent-2:#b20710;
      --match:#46d369; --scrim:rgba(11,11,16,.76); --shadow:0 18px 52px rgba(0,0,0,.58);
      --hero-scrim:linear-gradient(90deg,rgba(11,11,16,.98) 0%,rgba(11,11,16,.72) 43%,rgba(11,11,16,.16) 72%),linear-gradient(0deg,#0b0b10 0%,transparent 34%);
    }
    @media (prefers-color-scheme: light) {
      :root { color-scheme:dark; }
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-width:320px;overflow-x:hidden}
    button,input{font:inherit}
    button{color:inherit}
    img{display:block}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .nav{position:fixed;z-index:80;top:0;left:0;right:0;height:68px;display:flex;align-items:center;gap:18px;padding:0 clamp(18px,4vw,64px);background:linear-gradient(180deg,rgba(5,5,8,.94),rgba(5,5,8,.45),transparent);transition:background .25s,border-color .25s;border-bottom:1px solid transparent;color:#fff}
    .nav.solid{background:var(--scrim);backdrop-filter:blur(14px);border-color:var(--line);color:var(--text)}
    .nav-links{display:flex;align-items:center;gap:6px;min-width:0}
    .nav-link{border:0;background:transparent;color:inherit;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;opacity:.78}
    .nav-link:hover,.nav-link:focus-visible,.nav-link.active{opacity:1;background:rgba(255,255,255,.1)}
    .nav-spacer{flex:1}
    .search-shell{position:relative;display:flex;align-items:center;height:40px}
    .search-toggle{position:absolute;right:0;z-index:2;border:0;background:transparent;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
    .search-toggle:hover,.search-toggle:focus-visible{background:rgba(255,255,255,.12)}
    .search-input{width:40px;height:40px;border:1px solid transparent;border-radius:20px;background:transparent;color:inherit;outline:0;padding:0 42px 0 14px;opacity:0;visibility:hidden;cursor:pointer;transition:width .25s,opacity .2s,border-color .2s,background .2s}
    .search-shell.open .search-input{width:min(320px,42vw);opacity:1;visibility:visible;cursor:text;border-color:var(--line);background:var(--surface)}
    .search-input::placeholder{color:var(--muted)}
    .hero{position:relative;min-height:630px;height:min(78vh,780px);display:flex;align-items:flex-end;overflow:hidden;color:#fff}
    .hero-media{position:absolute;inset:0}
    .hero-media img{width:100%;height:100%;object-fit:cover;object-position:center;transition:opacity .45s}
    .hero-media::after{content:"";position:absolute;inset:0;background:var(--hero-scrim)}
    .hero-copy{position:relative;z-index:2;width:min(690px,88vw);padding:0 0 116px clamp(20px,5vw,78px)}
    .hero-kicker{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff}
    .hero-kicker::before{content:"";width:30px;height:3px;background:var(--accent)}
    .hero h1{font-size:clamp(40px,6.5vw,82px);line-height:.94;letter-spacing:-.055em;margin:18px 0 18px;max-width:680px;text-shadow:0 3px 18px rgba(0,0,0,.34)}
    .hero-meta{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;margin-bottom:15px}
    .match{color:var(--match)}
    .age{border:1px solid rgba(255,255,255,.55);padding:2px 6px;border-radius:3px}
    .hero-overview{max-width:610px;font-size:clamp(15px,1.5vw,18px);line-height:1.58;margin:0 0 24px;color:#ededf2;text-shadow:0 2px 12px #000}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    .btn{border:0;border-radius:6px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;cursor:pointer;transition:background .2s,transform .2s;color:#fff}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:#fff;color:#101015}.btn-primary:hover{background:#dedee3}
    .btn-secondary{background:rgba(90,90,98,.75);backdrop-filter:blur(8px)}.btn-secondary:hover{background:rgba(110,110,118,.85)}
    .btn-accent{background:var(--accent)}.btn-accent:hover{background:var(--accent-2)}
    .hero-controls{position:absolute;z-index:4;right:clamp(18px,4vw,64px);bottom:116px;display:flex;align-items:center;gap:10px}
    .hero-arrow{width:42px;height:42px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(8,8,12,.36);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
    .hero-arrow:hover{background:rgba(8,8,12,.75)}
    .dots{display:flex;gap:7px;padding:0 3px}
    .dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.44);cursor:pointer;transition:width .2s,background .2s}
    .dot.active{width:25px;border-radius:4px;background:var(--accent)}
    .content{position:relative;z-index:5;margin-top:-70px;padding-bottom:36px}
    .view-head{padding:110px clamp(18px,4vw,64px) 14px}
    .view-head h1{font-size:clamp(34px,5vw,64px);letter-spacing:-.045em;margin:0 0 10px}
    .view-head p{color:var(--muted);margin:0;line-height:1.5}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
    .chip{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;color:var(--text);cursor:pointer;font-size:13px;font-weight:700}
    .chip:hover,.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
    .rows{display:flex;flex-direction:column;gap:31px}
    .shelf{position:relative}
    .shelf-heading{display:flex;align-items:baseline;justify-content:space-between;padding:0 clamp(18px,4vw,64px) 12px;gap:15px}
    .shelf h2{font-size:clamp(19px,2vw,26px);letter-spacing:-.025em;margin:0}
    .shelf-count{font-size:12px;color:var(--muted)}
    .rail-wrap{position:relative}
    .rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(155px,17vw,232px);gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;scrollbar-width:none;padding:3px clamp(18px,4vw,64px) 30px}
    .rail::-webkit-scrollbar{display:none}
    .rail-arrow{position:absolute;z-index:12;top:0;bottom:30px;width:48px;border:0;background:rgba(8,8,12,.7);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s}
    .rail-wrap:hover .rail-arrow,.rail-arrow:focus-visible{opacity:1}
    .rail-arrow.prev{left:0}.rail-arrow.next{right:0}
    .card{position:relative;scroll-snap-align:start;background:var(--surface-2);border-radius:7px;overflow:hidden;aspect-ratio:2/3;box-shadow:0 2px 10px rgba(0,0,0,.16);cursor:pointer;isolation:isolate}
    .card img{width:100%;height:100%;object-fit:cover;transition:transform .32s}
    .card::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(5,5,9,.98));opacity:.45;transition:opacity .25s}
    .card:hover img,.card:focus-within img{transform:scale(1.035)}
    .card:hover::after,.card:focus-within::after{opacity:1}
    .card-info{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:14px;transform:translateY(34px);transition:transform .25s;color:#fff}
    .card:hover .card-info,.card:focus-within .card-info{transform:translateY(0)}
    .card-title{font-size:14px;line-height:1.25;font-weight:800;margin:0 0 6px;text-shadow:0 1px 4px #000}
    .card-meta{display:flex;gap:7px;font-size:11px;color:#ddd;align-items:center;margin-bottom:10px}
    .card-actions{display:flex;gap:7px;opacity:0;transition:opacity .2s}
    .card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
    .round-btn{width:33px;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.65);background:rgba(12,12,18,.74);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
    .round-btn:hover{background:#fff;color:#111}
    .round-btn.in-list{background:var(--accent);border-color:var(--accent);color:#fff}
    .card-fallback{background:radial-gradient(circle at 65% 20%,#3b3b48,#17171f 50%,#09090d)}
    .top-card{aspect-ratio:auto;display:grid;grid-template-columns:minmax(76px,.72fr) minmax(110px,1fr);background:transparent;box-shadow:none;overflow:visible;border-radius:0;cursor:pointer}
    .rank{font-weight:900;font-size:clamp(104px,13vw,176px);line-height:.88;letter-spacing:-.1em;color:var(--bg);-webkit-text-stroke:clamp(2px,.22vw,4px) var(--muted);text-shadow:3px 4px 0 var(--surface-2);align-self:end;text-align:right;padding-right:6px;z-index:-1}
    .top-card .card{width:100%}
    .grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:12px clamp(18px,4vw,64px) 54px}
    .empty{margin:26px clamp(18px,4vw,64px);border:1px dashed var(--line);padding:42px 24px;text-align:center;color:var(--muted);border-radius:10px}
    .empty strong{color:var(--text);display:block;font-size:20px;margin-bottom:8px}
    .search-panel{position:fixed;z-index:70;top:68px;left:0;right:0;max-height:min(74vh,720px);overflow-y:auto;background:var(--scrim);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:20px clamp(18px,4vw,64px) 30px;display:none}
    .search-panel.open{display:block}
    .search-summary{margin:0 0 14px;color:var(--muted);font-size:14px}
    .search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
    .search-grid .card-info{transform:translateY(0)}
    .modal,.theatre{position:fixed;inset:0;z-index:120;display:none;background:rgba(3,3,6,.86);backdrop-filter:blur(10px);padding:clamp(10px,3vw,36px);overflow:auto}
    .modal.open,.theatre.open{display:grid}
    .modal{place-items:center}
    .modal-card{width:min(930px,100%);background:var(--surface);box-shadow:var(--shadow);border-radius:10px;overflow:hidden;position:relative}
    .modal-media{aspect-ratio:16/8.7;background:#050507;position:relative}
    .modal-media iframe,.modal-media img{width:100%;height:100%;border:0;object-fit:cover}
    .close-btn{position:absolute;z-index:4;top:14px;right:14px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(8,8,12,.78);color:#fff;display:grid;place-items:center;cursor:pointer}
    .modal-body{padding:clamp(20px,4vw,38px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(180px,.7fr);gap:32px}
    .modal h2{font-size:clamp(28px,4vw,48px);letter-spacing:-.045em;margin:0 0 9px}
    .modal-meta{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;margin-bottom:18px}
    .modal-overview{line-height:1.68;color:var(--muted);margin:0 0 22px}
    .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:9px}
    .genre-list{display:flex;flex-wrap:wrap;gap:7px}
    .genre-tag{font-size:12px;background:var(--surface-2);padding:7px 9px;border-radius:4px}
    .theatre{place-items:center;background:radial-gradient(circle at 50% 20%,#24242d,#050507 58%);padding:0}
    .cinema{width:100%;height:100%;display:grid;grid-template-rows:1fr auto;place-items:center;perspective:1100px;position:relative;overflow:hidden}
    .screen-wrap{width:min(84vw,1200px);aspect-ratio:16/9;transform:rotateX(-1.5deg);box-shadow:0 0 0 9px #1b1b20,0 0 0 11px #555,0 30px 100px rgba(229,9,20,.18);background:#000;position:relative}
    .screen-wrap::after{content:"";position:absolute;inset:auto 8% -34% 8%;height:30%;background:linear-gradient(rgba(229,9,20,.11),transparent);filter:blur(18px);transform:rotateX(70deg);pointer-events:none}
    .screen-wrap iframe{width:100%;height:100%;border:0}
    .seats{height:92px;width:94vw;background:repeating-radial-gradient(ellipse at 50% 110%,#281116 0 13px,#0a090c 14px 31px);opacity:.82;mask-image:linear-gradient(transparent,#000 48%)}
    .theatre-label{position:absolute;top:22px;left:24px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em}
    .theatre .close-btn{position:fixed}
    footer{border-top:1px solid var(--line);padding:34px clamp(18px,4vw,64px) 48px;color:var(--muted);font-size:12px;line-height:1.7;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    footer a{color:inherit}
    .reduced-note{font-size:13px;color:var(--muted);margin-top:6px}
    :focus-visible{outline:4px solid #fff;outline-offset:4px;box-shadow:0 0 0 8px var(--accent),0 8px 28px rgba(0,0,0,.72);position:relative;z-index:40}
    .card:focus-visible{outline-width:5px;outline-offset:5px;box-shadow:0 0 0 10px var(--accent),0 18px 42px rgba(0,0,0,.82)}
    .card:focus-visible img{transform:scale(1.035)}
    .card:focus-visible::after{opacity:1}
    .card:focus-visible .card-info{transform:translateY(0)}
    .card:focus-visible .card-actions{opacity:1}
    .search-input:focus-visible{outline-offset:2px}
    @media (forced-colors:active){:focus-visible{outline:5px solid Highlight;box-shadow:none}}
    @media (max-width:760px){
      .nav{height:60px;padding:0 12px;gap:4px;background:rgba(7,7,10,.9);overflow:visible}
      .nav-links{gap:0;overflow-x:auto;scrollbar-width:none;padding-right:42px}
      .nav-link{font-size:12px;padding:8px 9px}
      .search-shell{position:absolute;right:10px}
      .search-shell:not(.open) .search-input{display:none}
      .search-shell.open{left:10px;right:10px;z-index:5;background:var(--surface)}
      .search-shell.open .search-input{display:block;width:100%;max-width:none;background:var(--surface)}
      .hero{height:auto;min-height:680px;align-items:flex-end}
      .hero-media img{object-position:62% center}
      .hero-media::after{background:linear-gradient(0deg,var(--bg) 1%,rgba(8,8,12,.86) 43%,rgba(8,8,12,.18) 80%)}
      .hero-copy{padding:0 18px 90px;width:100%}
      .hero h1{font-size:46px;max-width:94%}
      .hero-overview{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
      .hero-controls{left:18px;right:18px;bottom:22px;justify-content:space-between}
      .hero-controls .hero-arrow{display:grid;width:40px;height:40px;flex:0 0 40px}
      .dots{flex:1;justify-content:center}
      .dot{width:10px;height:10px}.dot.active{width:28px}
      .content{margin-top:0}.rows{gap:25px}
      .rail{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-columns:unset;overflow:visible;padding:3px 14px 18px;gap:9px}
      .rail>*:nth-child(n+7){display:none}
      .rail-arrow{display:none}
      .shelf-heading{padding:0 14px 10px}
      .top-card{grid-template-columns:minmax(55px,.65fr) minmax(100px,1fr)}
      .top-card:nth-child(n+7){display:none}
      .rank{font-size:25vw}
      .grid-view{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 14px 44px;gap:9px}
      .card-info{transform:translateY(0);padding:11px}.card-actions{opacity:1}.card-title{font-size:12px}.card-meta{font-size:10px}
      .round-btn{width:30px;height:30px}.round-btn .icon{width:16px;height:16px}
      .view-head{padding:90px 14px 12px}.view-head h1{font-size:38px}
      .search-panel{top:60px;padding:16px 14px 24px}.search-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
      .modal{padding:0;place-items:end center;background:rgba(3,3,6,.9)}
      .modal-card{border-radius:12px 12px 0 0;max-height:94vh;overflow:auto}
      .modal-media{aspect-ratio:16/9}
      .modal-body{grid-template-columns:1fr;gap:22px;padding:20px}
      .screen-wrap{width:96vw}
      .theatre-label{top:14px;left:14px;max-width:70%;font-size:11px}
      footer{padding:28px 14px 40px}
    }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <nav class="nav" id="nav" aria-label="Browse">
    <div class="nav-links">
      <button class="nav-link active" data-view="home">Home</button>
      <button class="nav-link" data-view="movie">Movies</button>
      <button class="nav-link" data-view="tv">TV Shows</button>
      <button class="nav-link" data-view="list">My List</button>
    </div>
    <div class="nav-spacer"></div>
    <div class="search-shell" id="searchShell">
      <label class="sr-only" for="searchInput">Search titles</label>
      <input class="search-input" id="searchInput" type="search" autocomplete="off" tabindex="-1" placeholder="Titles, genres, years">
      <button class="search-toggle" id="searchToggle" aria-label="Open search" aria-expanded="false">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      </button>
    </div>
  </nav>

  <div id="app"></div>
  <section class="search-panel" id="searchPanel" aria-live="polite">
    <p class="search-summary" id="searchSummary"></p>
    <div class="search-grid" id="searchGrid"></div>
  </section>

  <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <article class="modal-card" id="modalCard"></article>
  </div>

      <div class="screen-wrap" id="screenWrap"></div>
      <div class="seats" aria-hidden="true"></div>
    </div>
  </div>

    const listed=state.list.has(item.id);
    return `<article class="card" data-id="${item.id}" tabindex="0" role="button" aria-haspopup="dialog" aria-label="${safe(item.title)}, ${item.year}">
      <img src="${posterPath(item)}" alt="${safe(item.title)} poster" loading="lazy" onerror="fallback(this)">
      <div class="card-info"><h3 class="card-title">${safe(item.title)}</h3><div class="card-meta"><span class="match">${Math.round(item.rating*10)}% Match</span><span>${item.year}</span></div>
      <div class="card-actions">
        ${item.trailer?`<button class="round-btn" data-action="play" aria-label="Play ${safe(item.title)} trailer">${icon('play')}</button>`:''}
        <button class="round-btn ${listed?'in-list':''}" data-action="list" aria-label="${listed?'Remove from':'Add to'} My List">${icon(listed?'check':'plus')}</button>
        <button class="round-btn" data-action="detail" aria-label="More information about ${safe(item.title)}">${icon('info')}</button>
      </div></div></article>`;
  }
  function topCard(item,index){ return `<div class="top-card"><div class="rank" aria-hidden="true">${index+1}</div>${card(item)}</div>`; }
  function shelf(title, items, top=false){
    if(!items.length) return '';
    const id='rail-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    return `<section class="shelf"><div class="shelf-heading"><h2>${safe(title)}</h2><span class="shelf-count">${items.length} titles</span></div><div class="rail-wrap">
      <button class="rail-arrow prev" data-scroll="-1" aria-label="Scroll ${safe(title)} left">${icon('left')}</button>
      <div class="rail" id="${id}">${items.map((x,i)=>top?topCard(x,i):card(x)).join('')}</div>
      <button class="rail-arrow next" data-scroll="1" aria-label="Scroll ${safe(title)} right">${icon('right')}</button>
    </div></section>`;
  }
  function sorted(filter){ return catalog.filter(filter).slice().sort((a,b)=>b.rating-a.rating || b.year-a.year); }
  function rowData(){
    return [
      ['Trending Now',trendingNames.map(byTitle).filter(Boolean),false],
      ['Top 10 Today',sorted(()=>true).slice(0,10),true],
      ['Popular Movies',sorted(x=>x.kind==='movie').slice(0,14),false],
      ['Popular TV Shows',sorted(x=>x.kind==='tv'),false],
      ['Action & Adventure',sorted(x=>x.genres.some(g=>['Action','Adventure','Action Adventure'].includes(g))).slice(0,16),false],
      ['Sci-Fi & Fantasy',sorted(x=>x.genres.some(g=>['Science Fiction','Sci Fi Fantasy','Fantasy'].includes(g))).slice(0,16),false],
      ['Comedies',sorted(x=>x.genres.includes('Comedy')).slice(0,14),false],
      ['Animation & Family',sorted(x=>x.genres.some(g=>['Animation','Family'].includes(g))).slice(0,14),false],
      ['Critically Acclaimed',sorted(x=>x.rating>=8).slice(0,16),false]
    ];
  }
  function heroMarkup(){
    const item=featured[state.hero];
    return `<section class="hero" aria-label="Featured: ${safe(item.title)}">
      <div class="hero-media"><img src="${backdropPath(item)}" alt="Scene from ${safe(item.title)}" onerror="fallback(this)"></div>
      <div class="hero-copy"><div class="hero-kicker">Featured ${item.kind==='tv'?'series':'film'}</div><h1>${safe(item.title)}</h1>
        <div class="hero-meta"><span class="match">${Math.round(item.rating*10)}% Match</span><span>${item.year}</span><span class="age">${item.kind==='tv'?'Series':'Film'}</span></div>
        <p class="hero-overview">${safe(item.overview)}</p><div class="actions">
          ${item.trailer?`<button class="btn btn-primary" data-id="${item.id}" data-action="play">${icon('play')} Play trailer</button>`:''}
          <button class="btn btn-secondary" data-id="${item.id}" data-action="detail">${icon('info')} More info</button>
        </div></div>
      <div class="hero-controls"><button class="hero-arrow" data-hero="-1" aria-label="Previous feature">${icon('left')}</button>
        <div class="dots">${featured.map((_,i)=>`<button class="dot ${i===state.hero?'active':''}" data-hero-index="${i}" aria-label="Show feature ${i+1}"></button>`).join('')}</div>
        <button class="hero-arrow" data-hero="1" aria-label="Next feature">${icon('right')}</button></div>
    </section>`;
  }
  function footer(){return `<footer><span>Title metadata and imagery: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. Trailers: <a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>.</span><span>Demo discovery interface. Not affiliated with Netflix.</span></footer>`;}
  function renderHome(){
    app.innerHTML=heroMarkup()+`<main class="content"><div class="rows">${rowData().map(r=>shelf(...r)).join('')}</div></main>`+footer();
    restartHero();
  }
  function genresFor(kind){return ['All',...Array.from(new Set(catalog.filter(x=>x.kind===kind).flatMap(x=>x.genres))).sort()];}
  function renderCatalog(kind){
    stopHero(); const label=kind==='movie'?'Movies':'TV Shows'; const all=catalog.filter(x=>x.kind===kind); const items=state.genre==='All'?all:all.filter(x=>x.genres.includes(state.genre));
    app.innerHTML=`<main><header class="view-head"><h1>${label}</h1><p>Browse ${all.length} titles and filter by genre.</p><div class="chips">${genresFor(kind).map(g=>`<button class="chip ${g===state.genre?'active':''}" data-genre="${safe(g)}">${safe(g)}</button>`).join('')}</div></header><div class="grid-view">${items.map(card).join('')}</div></main>`+footer();
  }
  function renderList(){
    stopHero(); const items=catalog.filter(x=>state.list.has(x.id));
    app.innerHTML=`<main><header class="view-head"><h1>My List</h1><p class="reduced-note">Demo: your list resets when you reload the page</p></header>${items.length?`<div class="grid-view">${items.map(card).join('')}</div>`:`<div class="empty"><strong>Your list is ready for a first pick.</strong>Use the + button on any title to add it here for this visit.</div>`}</main>`+footer();
  }
  function render(){
    document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
    if(state.view==='home') renderHome(); else if(state.view==='list') renderList(); else renderCatalog(state.view);
    window.scrollTo({top:0,behavior:'instant'});
  }
  function setHero(index){state.hero=(index+featured.length)%featured.length;if(state.view==='home')renderHome();}
  function restartHero(){stopHero();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)state.timer=setInterval(()=>setHero(state.hero+1),6500);}
  function stopHero(){if(state.timer){clearInterval(state.timer);state.timer=null;}}
  function titleById(id){return catalog.find(x=>x.id===Number(id));}
  function updateList(item){state.list.has(item.id)?state.list.delete(item.id):state.list.add(item.id); if(state.view==='list')renderList(); else document.querySelectorAll(`.card[data-id="${item.id}"]`).forEach(el=>{const b=el.querySelector('[data-action="list"]');if(b){const on=state.list.has(item.id);b.classList.toggle('in-list',on);b.innerHTML=icon(on?'check':'plus');b.setAttribute('aria-label',`${on?'Remove from':'Add to'} My List`);}});}
  function trailerURL(id,autoplay=false){return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1${autoplay?'&autoplay=1':''}`;}
  function openDetail(item){
    const active=document.activeElement;
    state.lastFocus=active?.closest?.('.card')||active; stopHero();
    const media=item.trailer?`<iframe src="${trailerURL(item.trailer)}" title="${safe(item.title)} trailer" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`:`<img src="${posterPath(item)}" alt="${safe(item.title)} poster" onerror="fallback(this)">`;
    const listed=state.list.has(item.id);
    document.getElementById('modalCard').innerHTML=`<div class="modal-media">${media}<button class="close-btn" data-close="modal" aria-label="Close details">${icon('x')}</button></div><div class="modal-body"><div><h2 id="modalTitle">${safe(item.title)}</h2><div class="modal-meta"><span class="match">${Math.round(item.rating*10)}% Match</span><span>${item.year}</span><span>${item.kind==='tv'?'Series':'Film'}</span></div><p class="modal-overview">${safe(item.overview)}</p><div class="actions"><button class="btn btn-accent" data-id="${item.id}" data-action="list">${icon(listed?'check':'plus')} ${listed?'In My List':'My List'}</button>${item.trailer?`<button class="btn btn-secondary" data-id="${item.id}" data-action="theatre">${icon('theatre')} 3D Theatre</button>`:''}</div></div><aside><div class="label">Genres</div><div class="genre-list">${item.genres.map(g=>`<span class="genre-tag">${safe(g)}</span>`).join('')}</div></aside></div>`;
    modal.classList.add('open'); document.body.style.overflow='hidden'; setTimeout(()=>modal.querySelector('.close-btn').focus(),0);
  }
  function restoreOpeningFocus(){
    const target=state.lastFocus;
    if(target?.isConnected){target.focus({preventScroll:true});target.scrollIntoView({block:'center',inline:'center'});}
  }
  function closeModal(resume=true){modal.classList.remove('open');document.getElementById('modalCard').innerHTML='';document.body.style.overflow='';if(resume&&state.view==='home')restartHero();if(resume)restoreOpeningFocus();}
  function openTheatre(item){
    if(!item.trailer)return;
    if(!modal.classList.contains('open'))state.lastFocus=document.activeElement?.closest?.('.card')||document.activeElement;
    closeModal(false); stopHero(); document.getElementById('theatreLabel').textContent=`Now playing · ${item.title}`;
    document.getElementById('screenWrap').innerHTML=`<iframe src="${trailerURL(item.trailer,true)}" title="${safe(item.title)} trailer in theatre mode" allow="autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    theatre.classList.add('open');document.body.style.overflow='hidden';document.getElementById('theatreClose').focus();
    if(theatre.requestFullscreen) theatre.requestFullscreen().catch(()=>{});
  }
  function closeTheatre(){theatre.classList.remove('open');document.getElementById('screenWrap').innerHTML='';document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(state.view==='home')restartHero();restoreOpeningFocus();}
  function openSearch(){searchShell.classList.add('open');searchPanel.classList.add('open');document.getElementById('searchToggle').setAttribute('aria-expanded','true');searchInput.tabIndex=0;searchInput.focus();doSearch();}
  function closeSearch(restore=false){searchShell.classList.remove('open');searchPanel.classList.remove('open');document.getElementById('searchToggle').setAttribute('aria-expanded','false');searchInput.tabIndex=-1;searchInput.value='';document.getElementById('searchGrid').innerHTML='';if(restore)document.getElementById('searchToggle').focus();}
  function doSearch(){
    const q=searchInput.value.trim().toLowerCase(); const found=q?catalog.filter(x=>[x.title,x.year,...x.genres].join(' ').toLowerCase().includes(q)):catalog.slice(0,8);
    document.getElementById('searchSummary').textContent=q?`${found.length} result${found.length===1?'':'s'} for “${searchInput.value.trim()}”`:'Popular searches';
    document.getElementById('searchGrid').innerHTML=found.length?found.slice(0,18).map(card).join(''):`<div class="empty"><strong>No titles found.</strong>Try a title, genre, or year.</div>`;
  }
  function isRemoteFocusable(el){
    if(!el||el.disabled||el.getAttribute('aria-hidden')==='true'||el.tabIndex<0)return false;
    const style=getComputedStyle(el);
    return style.display!=='none'&&style.visibility!=='hidden'&&el.getClientRects().length>0;
  }
  function inActiveLayer(el){
    if(theatre.classList.contains('open'))return theatre.contains(el);
    if(modal.classList.contains('open'))return modal.contains(el);
    if(searchPanel.classList.contains('open'))return searchShell.contains(el)||searchPanel.contains(el);
    return true;
  }
  function remoteFocusables(){
    return Array.from(document.querySelectorAll('button,input,a[href],.card[tabindex]')).filter(el=>isRemoteFocusable(el)&&inActiveLayer(el));
  }
  function focusRemoteTarget(target){
    if(!target)return false;
    target.focus({preventScroll:true});
    target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center',inline:'center'});
    return true;
  }
  function moveCardAlongRail(cardEl,direction){
    if(direction!=='left'&&direction!=='right')return false;
    const rail=cardEl.closest('.rail');
    if(!rail)return false;
    const cards=Array.from(rail.querySelectorAll('.card')).filter(isRemoteFocusable);
    const next=cards[cards.indexOf(cardEl)+(direction==='right'?1:-1)];
    return focusRemoteTarget(next);
  }
  function moveSpatial(current,direction){
    if(current?.matches('.card')&&moveCardAlongRail(current,direction))return true;
    let candidates=remoteFocusables().filter(el=>el!==current);
    if(current?.matches('.card'))candidates=candidates.filter(el=>!el.closest('.card')||el.matches('.card'));
    const from=(current&&isRemoteFocusable(current)?current:document.querySelector('.nav-link'));
    if(!from)return false;
    const a=from.getBoundingClientRect();
    const ax=a.left+a.width/2, ay=a.top+a.height/2;
    let best=null,bestScore=Infinity;
    candidates.forEach(el=>{
      const b=el.getBoundingClientRect();
      const bx=b.left+b.width/2, by=b.top+b.height/2;
      const dx=bx-ax,dy=by-ay;
      const primary=direction==='left'?-dx:direction==='right'?dx:direction==='up'?-dy:dy;
      const secondary=(direction==='left'||direction==='right')?Math.abs(dy):Math.abs(dx);
      if(primary<=5)return;
      const score=primary+secondary*(direction==='left'||direction==='right'?2.2:.45);
      if(score<bestScore){best=el;bestScore=score;}
    });
    return focusRemoteTarget(best);
  }
  function trapTab(e){
    const items=remoteFocusables();
    if(!items.length)return;
    const index=items.indexOf(document.activeElement);
    if(e.shiftKey&&(index<=0)){e.preventDefault();items[items.length-1].focus();}
    else if(!e.shiftKey&&(index===items.length-1||index<0)){e.preventDefault();items[0].focus();}
  }
  document.addEventListener('focusin',e=>{if(e.target.closest('#app'))stopHero();});
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-view]'); if(nav){state.view=nav.dataset.view;state.genre='All';closeSearch();render();return;}
    const genre=e.target.closest('[data-genre]'); if(genre){state.genre=genre.dataset.genre;renderCatalog(state.view);return;}
    const h=e.target.closest('[data-hero]'); if(h){setHero(state.hero+Number(h.dataset.hero));return;}
    const hi=e.target.closest('[data-hero-index]'); if(hi){setHero(Number(hi.dataset.heroIndex));return;}
    const scroll=e.target.closest('[data-scroll]'); if(scroll){scroll.parentElement.querySelector('.rail').scrollBy({left:Number(scroll.dataset.scroll)*innerWidth*.72,behavior:'smooth'});return;}
    const action=e.target.closest('[data-action]');
    if(action){const container=action.closest('[data-id]');const item=titleById(action.dataset.id||container?.dataset.id);if(!item)return;if(action.dataset.action==='list')updateList(item);if(action.dataset.action==='detail')openDetail(item);if(action.dataset.action==='play')openTheatre(item);if(action.dataset.action==='theatre')openTheatre(item);return;}
    if(e.target.closest('[data-close="modal"]')||e.target===modal)closeModal();
  });
  document.addEventListener('keydown',e=>{
    const keyCode=e.keyCode||e.which;
    const backKey=['Escape','Esc','Back','GoBack','BrowserBack'].includes(e.key)||[27,461,10009].includes(keyCode)||(keyCode===8&&!e.target.matches('input'));
    if(backKey){
      if(theatre.classList.contains('open')){e.preventDefault();closeTheatre();return;}
      if(modal.classList.contains('open')){e.preventDefault();closeModal();return;}
      if(searchShell.classList.contains('open')){e.preventDefault();closeSearch(true);return;}
    }
    if(e.key==='Tab'&&(theatre.classList.contains('open')||modal.classList.contains('open'))){trapTab(e);return;}
    const direction={ArrowLeft:'left',Left:'left',ArrowRight:'right',Right:'right',ArrowUp:'up',Up:'up',ArrowDown:'down',Down:'down'}[e.key]||({37:'left',38:'up',39:'right',40:'down'}[keyCode]);
    if(direction){
      if(e.target===searchInput&&(direction==='left'||direction==='right'))return;
      e.preventDefault();moveSpatial(document.activeElement,direction);return;
    }
    const okKey=e.key==='Enter'||e.key==='OK'||e.key==='Select'||e.key==='Accept'||keyCode===13;
    if(okKey){
      const cardEl=e.target.closest('.card');
      if(cardEl&&!e.target.closest('button')){e.preventDefault();openDetail(titleById(cardEl.dataset.id));return;}
      if(e.key!=='Enter'&&e.target.matches('button,a[href]')){e.preventDefault();e.target.click();}
    }
  });
  document.getElementById('searchToggle').addEventListener('click',()=>searchShell.classList.contains('open')?closeSearch():openSearch());
  searchInput.addEventListener('input',doSearch);
  document.getElementById('theatreClose').addEventListener('click',closeTheatre);
  window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('solid',scrollY>24),{passive:true});
  document.addEventListener('visibilitychange',()=>document.hidden?stopHero():(state.view==='home'&&restartHero()));
  render();
  </script>
</body>
</html>
